# dsh-i18n bundle patch
#
# The `dsh.bundle.patch` layer of the package: installing it into a profile —
#
#   dsh plugin --profile web add link:/home/rai/shiva-code/plugins/dsh-i18n
#
# — appends `dsh-i18n` to that profile's `dsh.profile.bundles`, and the boot
# merges this single `insert` (one plugin row) into the loader entry list. No
# profile file edits.
#
# The entry exists only so the web shell sees an ENABLED loader entry for this
# package: the client-modules scan serves `dsh.client` bundles for enabled
# entries alone. All behavior lives in the client half.
#
# Enabling this plugin adds two languages to the Language row in Settings; it
# changes nobody's active language on its own. A reader who already asked for
# one of them (a stored preference, or a browser that reports pt-BR or es)
# lands on it as soon as the entry is enabled — the request predates the
# install and outlives the gap.
- insert:
    - id: i18n
      name: 'dsh-i18n'
