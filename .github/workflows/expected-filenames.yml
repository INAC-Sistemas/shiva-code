name: Expected filenames

on:
  # Automatic triggers are off in this fork: the harness workflows need
  # upstream infrastructure this repository does not have, and only the
  # desktop release runs on its own. Run this by hand when it is needed.
  workflow_dispatch:

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  expected-filenames:
    name: no golden filenames
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check tracked filenames
        run: scripts/check-expected-filenames.sh
