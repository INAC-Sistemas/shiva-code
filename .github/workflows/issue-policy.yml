name: Issue policy

on:
  # Automatic triggers are off in this fork: the harness workflows need
  # upstream infrastructure this repository does not have, and only the
  # desktop release runs on its own. Run this by hand when it is needed.
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: Issue policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/issue-management/policy.mjs pr
