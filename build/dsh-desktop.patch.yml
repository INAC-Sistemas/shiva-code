# Keep the stock directory-picker (auto) row active: the native backend
# serves ctx.directoryPicker, so host-side consumers (host.pickDirectory,
# plugins reading the seam) work unmodified. The client surface keeps its
# Electron-dialog bridge via the client-ui patch in patches/.

# Disable the stock single-slot occupant before mounting Desktop's equivalent;
# two occupants cannot share either brand seat. The Desktop plugin preserves
# the stock conversation mark. The phone remains in the settings row because
# the public footer-action slot is a separate row. Window chrome geometry
# remains a native-shell concern.
- id: ui-brand-official
  disabled: true

- insert:
    - id: dsh-desktop-client-ui
      name: dsh-desktop-client-ui

    # DSH Desktop owns the fixed-target dsh-market installer and its lightweight
    # settings entry. After dshmarket is installed and Harness restarts, the
    # community plugin replaces the placeholder with its complete market UI.
    - id: dsh-desktop-market-installer
      name: dsh-desktop-market-installer

# dsh-market normally offers to restart its own Node process after mutations.
# The desktop shell has the real lifecycle authority, so keep that behavior off
# whenever the optional plugin is present in the composed profile.
- id: dsh-market
  inject: [desktopProfiles]
  config:
    profile: web
    allowRestart: false

# Harness creates the full Cordis HMR service after boot when no `hmr` service
# exists, and that service throws without Node's internal module loader —
# which a packaged Electron app cannot provide, so every signed macOS launch
# failed profile boot at that step. This row supplies the config-watching
# subset `watchUserPatches` actually needs; where the internals are reachable
# it stands aside and the real service loads unchanged.
- insert:
    - id: dsh-desktop-hmr-fallback
      name: dsh-desktop-hmr-fallback

# Preset package export and import. These two routes lived in a patch on
# dsh-host-apiproxy until 0.1.2-alpha.1 deleted that package; upstream ships no
# preset transfer of its own, so the capability moved into a desktop plugin
# that registers on the Connection fetch-route seam instead.
- insert:
    - id: dsh-desktop-preset-transfer
      name: dsh-desktop-preset-transfer

# shiva-code's own generic UI plugins, packed into
# packages/harness-0.1.2-alpha.4/npm-shiva-plugins/ the same way the
# @deepseek-ai/dsh-* set is packed into npm-dsh/. dsh-user-menu hard-injects
# 'loginSession' (an inner feature, not its top-level dsh.client.inject row),
# provided only by dsh-login — so dsh-login is included too, even though it
# is the one plugin here that authenticates against the plugin-manager VPS.
# Everything ELSE that peers on dsh-login (dsh-vps-status, dsh-ssh-tunnel,
# dsh-prototype, dsh-skill-library, dsh-mds, dsh-openviking, dsh-profiles,
# dsh-skill-manager) stays excluded — installable post-boot through the
# ordinary authenticated flow instead of being baked into the executable.
# dsh-better-sidebar goes first: the rest only soft-inject it (ctx.inject /
# ctx.get, never a hard `inject` row), so nothing here blocks on order, but
# the base plugin reads first. dsh-flowglass is the published 0.4.4, not
# shiva-code's local checkout — that copy's inject list is missing 'sessions'
# and crashes boot; see the dsh-flowglass client.js fix from earlier.
- insert:
    - id: dsh-better-sidebar
      name: dsh-better-sidebar
    - id: dsh-i18n
      name: dsh-i18n
    - id: dsh-clock
      name: dsh-clock
    - id: dsh-shiva-theme
      name: dsh-shiva-theme
    - id: dsh-user-menu
      name: dsh-user-menu
    - id: dsh-sidebar-qa
      name: dsh-sidebar-qa
    - id: dsh-docs-panel
      name: dsh-docs-panel
    - id: dsh-flowglass
      name: dsh-flowglass

    # Config replicated verbatim from dsh-login's own cordis.patch.yml (the
    # bundle patch a `dsh.profile.bundles` entry would apply automatically —
    # this profile never adds one, so the shape is reproduced here instead).
    # $VPS_URL comes from harness-runtime.ts's buildHarnessSpawnOptions,
    # defaulting to the production plugin-manager
    # (https://shivaplugins.grupoinac.com.br) for this shipped build.
    - id: login
      name: dsh-login
      config:
        endpoint: !!js "new URL('/api/auth/login', process.env.VPS_URL).href"
        logoutEndpoint: !!js "new URL('/api/auth/logout', process.env.VPS_URL).href"
        validateEndpoint: !!js "new URL('/api/auth/me', process.env.VPS_URL).href"
        title: Entrar
        subtitle: Faça login para usar o Shiva Code.
        identifierLabel: E-mail
        passwordLabel: Senha
        submitLabel: Entrar
