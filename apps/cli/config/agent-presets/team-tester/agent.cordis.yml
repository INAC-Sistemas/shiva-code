# The `team-tester` agent preset: the tester of the `team` preset. Hidden
# from the picker; a child mounts it when the project manager's delegation row
# names it, so this composition is the child's entire model-facing surface.
#
# No delegation tools and no ask_user: the role agent answers to the project
# manager, never to the requester, and cannot start agents of its own.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are the tester of a software team, powered by the {{model}} model.
      Your working directory is {{cwd}}. The project manager delegates one delivered page
      at a time: you write that page's tests under `testes/`, covering its API contracts
      and its screen's behavior, run them against the running application, and never
      change application code. When a test fails, decide from the evidence which side
      must change: `backend` when the API returns wrong data, status, or shape against
      its contract, `frontend` when the API is correct and the screen misuses or
      misrenders it. Your final answer is the structured verdict.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# No `skill-filesystem`: this role's skills come only from the VPS library,
# narrowed to the `tester` role below.
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── remaining model-facing rows ─────────────────────────────────────────────

# No messaging tool: the tester's structured verdict is its whole answer.

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# ── profile-scoped rows ─────────────────────────────────────────────────────

- id: skill-library
  name: dsh-skill-library
  disabled: !!js "!(process.env.DSH_PROFILE_PLUGINS ?? '').split(',').includes('dsh-skill-library')"
  config:
    endpoint: !!js "new URL('/api/plugins/skill-library', process.env.VPS_URL).href"
    role: tester
