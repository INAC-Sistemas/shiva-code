# The `team` agent preset: a project manager that owns the requirements, the
# architecture, the domain map, and the per-slice plan, and delegates every slice to
# role agents that run on their own presets.
#
# Each delegation tool names an `agentPreset`, so its child MOUNTS that preset
# instead of joining this one: the backend, frontend, and tester agents see only
# their own persona, tools, and skills, and none of this composition. The
# manager itself carries no shell and writes no code; its filesystem tools exist
# for the architecture and task documents under `mds/`.
#
# The role presets (`team-backend`, `team-frontend`, `team-tester`) are hidden
# from the picker and live beside this one; `verify-cordis-config` fails when a
# delegation row names a preset that is not a sibling directory.
#
# Rules shared with `profile`: this is an AGENT-PLANE composition, a service
# row must sit inside a group carrying an `isolate` realm, and profile-scoped
# rows gate on `$DSH_PROFILE_PLUGINS`.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are the project manager of a software team, powered by the {{model}} model.
      Your working directory is {{cwd}}. You own the requirements, the architecture,
      the technology stack, and the delivery plan: you interview the requester, record
      every feature, and map the system into business domains. Before building each
      domain you run a question session with the requester on every object it keeps:
      its information, life cycle, permissions per role, restrictions, and relations.
      Then you break the domain into small slices, one task per behaviour the requester
      can see and use. You never write application code yourself. Each slice
      is delivered by delegation: the backend developer first publishes its contracts,
      then builds its data and API while the frontend developer builds its screen on
      those contracts, and the tester builds and runs the slice's tests while you show
      the requester a labeled preview. When the tester reports a failure, forward its
      evidence with send_message to the same developer who built that side of the
      slice, then test again. Reply to the requester in the language they write in.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── documents ───────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── skills ──────────────────────────────────────────────────────────────────

# No `skill-filesystem`: the manager's skills come only from the VPS library,
# narrowed to the `pm` role below.
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation ──────────────────────────────────────────────────────────────

# `maxDepth: 1` lets the manager (depth 0) start role agents and keeps them
# from delegating further; their presets carry no delegation tool either. All
# three run `continuable`, so the manager never blocks on a role agent and each
# one keeps its context across the slices and fixes it receives by send_message.
# `agentOptions` sets each role's model and reasoning effort; change a role's
# speed or quality here.
- id: delegation
  name: cordis:group
  group: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: delegate-backend
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: delegate_backend
        agentPreset: team-backend
        backgroundMode: continuable
        maxDepth: 1
        agentOptions:
          provider: deepseek-official
          model: deepseek-v4-flash
          reasoningEffort: high
        toolDescription: >-
          Delegate a domain's backend to the backend developer, one slice at a time and
          in two phases: first the slice's validated contracts, then, on your
          send_message, its persistence (the domain's migration on its first slice),
          seed data, rules, and API endpoints. The developer
          works in its own session with backend tools and skills and does not see this
          conversation, so give it the slice's task file, the domain document, and every decision
          it needs. Record the returned id in the task file: the domain's later slices and fixes go
          to the same developer through send_message.

    - id: delegate-frontend
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: delegate_frontend
        agentPreset: team-frontend
        backgroundMode: continuable
        maxDepth: 1
        agentOptions:
          provider: deepseek-official
          model: deepseek-v4-flash-vision-exp
          reasoningEffort: high
        toolDescription: >-
          Delegate a domain's screens to the frontend developer, one slice at a time:
          layout, components, states, and calls to the slice's API contracts, built while
          the backend implements them and then run on the real API, with a screenshot for
          the requester's preview. The developer works in its own session with frontend
          tools and skills and does not see this conversation, so give it the slice's task
          file, the domain document, the contracts the backend published, and the design
          decisions. Record the returned id in the task file: the domain's later slices and fixes go to the same
          developer through send_message.

    - id: delegate-tester
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: delegate_tester
        agentPreset: team-tester
        backgroundMode: continuable
        maxDepth: 1
        agentOptions:
          provider: deepseek-official
          model: deepseek-v4-flash
          reasoningEffort: low
        toolDescription: >-
          Delegate the epic's testing to the tester, one slice at a time and in two
          phases: first it writes the slice's test suite from the task file, the domain
          document's permissions and rules, and the contracts while the developers build, then, on your send_message "run", it runs
          the suite against the running application. Each run ends with a JSON verdict
          block: `status` pass or fail, and on failure the `side` (backend or frontend)
          that must change, the `evidence`, and the `failingTests`. It does not see this
          conversation, so name the slice, its task file, and how to start the app.
          Record the returned id in the task file: later slices and reruns go to the same
          tester through send_message.

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── profile-scoped rows ─────────────────────────────────────────────────────

# The VPS skill library narrowed to the `pm` role: the server serves only the
# active profile's skills tagged for it.
- id: skill-library
  name: dsh-skill-library
  disabled: !!js "!(process.env.DSH_PROFILE_PLUGINS ?? '').split(',').includes('dsh-skill-library')"
  config:
    endpoint: !!js "new URL('/api/plugins/skill-library', process.env.VPS_URL).href"
    role: pm
    prerequisites:
      pm-architecture: [pm-start-here]
      pm-domain-loop: [pm-start-here, pm-architecture]
